name: kindynos

services:
  app:
    build: .
    env_file: .env
    # Run as the host user so files written to the ./files volume stay editable
    # on the host (as root they would be root-owned). Override UID/GID if yours differ.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # The Hugging Face cache, kept on the host in files/.cache/: without a local checkpoint the
      # published model is downloaded there once
      HF_HOME: /app/files/.cache/huggingface
    volumes:
      - ./files:/app/files
      # The Laya checkpoint (training/checkpoints/laya-causal-v4) is not in the image: the
      # container reads it from the host, read-only
      - ./training:/app/training:ro
    ports:
      - "8000:8000"
