<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="../../files/img/brand/kindynos-mark.svg" />
    <title>Kindynos</title>
    <script>
      // Before the first paint, the theme chosen on an earlier visit (ui/src/theme/system.ts)
      try {
        const theme = localStorage.getItem('kindynos:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {
        // Storage blocked: the page follows the system
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
